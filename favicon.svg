<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d060"/>
      <stop offset="30%" stop-color="#c8960c"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9d423"/>
      <stop offset="30%" stop-color="#c8960c"/>
      <stop offset="60%" stop-color="#f5d060"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>

  <!-- Fond sombre -->
  <circle cx="50" cy="50" r="49" fill="url(#bgGrad)"/>

  <!-- Anneau doré extérieur -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="url(#ringGrad)" stroke-width="4"/>
  <!-- Anneau doré intérieur -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#ringGrad)" stroke-width="1.5"/>

  <!-- Texte SA -->
  <text x="50" y="62"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="bold"
    font-size="46"
    fill="url(#goldGrad)"
    letter-spacing="-2">SA</text>
</svg>
